name: Deploy site to GitHub Pages

# Runs manually (or on push) once GitHub Pages is enabled for the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The Actions bot cannot auto-create the Pages site, so enable it once by hand,
# then this workflow deploys the site to https://treasureclyde-sketch.github.io/sitesdemos/
on:
  workflow_dispatch:
  push:
    branches: ["claude/funscool"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
