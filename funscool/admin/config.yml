# Sveltia CMS configuration for the Funscool site.
# The editor logs in with GitHub (one click); after that they only see simple
# forms — photo/name/text — never any code. Saving commits to the repo, then
# GitHub Pages / Netlify rebuild the live site automatically (~1 min).
#
# Login uses Netlify's built-in OAuth (the site is hosted on Netlify), so NO
# Cloudflare worker is needed. Open the panel from the Netlify URL: <site>/admin/.
# Setup is in ADMIN-SETUP.md, Part 1.

backend:
  name: github
  repo: treasureclyde-sketch/sitesdemos   # owner/repo
  branch: claude/funscool                 # the branch the live site is built from

# Where uploaded images are committed (path inside the git repo) …
media_folder: "funscool/assets/img/teachers"
# … and the path the published site uses to reference them
public_folder: "/assets/img/teachers"

locale: "ru"

collections:
  - name: "teachers"
    label: "Воспитатели"
    description: "Карточки педагогов на странице «Наши педагоги»."
    files:
      - name: "list"
        label: "Список воспитателей"
        file: "funscool/content/teachers.json"
        format: "json"
        fields:
          - label: "Воспитатели"
            name: "teachers"
            label_singular: "Воспитатель"
            widget: "list"
            summary: "{{fields.name.ru}}"
            fields:
              - { label: "Фото", name: "photo", widget: "image" }
              - label: "Акцентный цвет карточки"
                name: "color"
                widget: "select"
                default: "purple"
                options:
                  - { label: "Зелёный", value: "green" }
                  - { label: "Фиолетовый", value: "purple" }
                  - { label: "Бирюзовый", value: "teal" }
                  - { label: "Розовый", value: "pink" }
              - label: "Имя"
                name: "name"
                widget: "object"
                fields:
                  - { label: "Русский", name: "ru", widget: "string" }
                  - { label: "Српски", name: "sr", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
              - label: "Теги / роль"
                name: "tags"
                widget: "list"
                label_singular: "Тег"
                required: false
                summary: "{{fields.ru}}"
                fields:
                  - { label: "Русский", name: "ru", widget: "string" }
                  - { label: "Српски", name: "sr", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
              - label: "О себе / био"
                name: "bio"
                widget: "object"
                fields:
                  - { label: "Русский", name: "ru", widget: "text" }
                  - { label: "Српски", name: "sr", widget: "text", required: false }
                  - { label: "English", name: "en", widget: "text", required: false }

  - name: "faq"
    label: "Вопросы (FAQ)"
    description: "Частые вопросы родителей в блоке «Частые вопросы»."
    files:
      - name: "list"
        label: "Список вопросов"
        file: "funscool/content/faq.json"
        format: "json"
        fields:
          - label: "Вопросы"
            name: "faq"
            label_singular: "Вопрос"
            widget: "list"
            summary: "{{fields.q.ru}}"
            fields:
              - label: "Вопрос"
                name: "q"
                widget: "object"
                fields:
                  - { label: "Русский", name: "ru", widget: "string" }
                  - { label: "Српски", name: "sr", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
              - label: "Ответ"
                name: "a"
                widget: "object"
                fields:
                  - { label: "Русский", name: "ru", widget: "text" }
                  - { label: "Српски", name: "sr", widget: "text", required: false }
                  - { label: "English", name: "en", widget: "text", required: false }
